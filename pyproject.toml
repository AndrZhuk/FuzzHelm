[project]
name = "fuzzhelm"
version = "0.1.0"
description = "FuzzHelm: сервіс агрегації біржових даних з нечітко-логічним ядром рішень і детермінованим ризик-контуром (paper/testnet only)"
authors = [
    { name = "AndriiZhuk", email = "andri195595@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler<4",
    "asyncpg>=0.31.0",
    "bcrypt<4.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.1",
    "orjson>=3.12.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=13",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "time-machine>=3.5.1",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
fuzzhelm = "fuzzhelm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration and not live and not slow'"
markers = [
  "integration: потребує PostgreSQL з docker-compose (make test-int)",
  "live: ходить у мережу (ніколи в make test)",
  "property: property-based тест (hypothesis)",
  "slow: довгий тест (>2 с)",
]
filterwarnings = [
  "ignore::DeprecationWarning:passlib.*",
  "ignore:.*crypt.*:DeprecationWarning",
]

# Покриття (брифінг §10, §12 фаза 10). Рахується ВЕСЬ src/fuzzhelm, без omit: cli.py, workers/, infra/ теж
# (раніше їх виключали — це завищувало відсоток). Два заміри (docs/deviations.d/quality_pass.md, QP-01):
#   * `make cov` — типовий офлайн-набір; SQL storage/ і БД-шляхи workers/ тут не виконуються, тож число
#     занижене; fail_under = 80 — запобіжник регресії на кожен прогін;
#   * офіційне число гейта фази 10 — об'єднаний прогін з інтеграційними тестами на PostgreSQL:
#     docker compose -f docker-compose.test.yml up -d --wait && FUZZHELM_TEST_DATABASE_URL=... \
#     uv run pytest -m "integration or not integration" --cov (той самий fail_under).
# Вузли `pragma: no cover` перелічено в QP-01; нових не додано (QR-02: один необґрунтований у fuzzy/defuzz.py знято).
# Заглушки `...` виключаються лише як ціле тіло/однорядковий def-заглушка (протоколи, @overload), а НЕ будь-який
# рядок із «...»: колишній шаблон "\.\.\." мовчки викидав зі звіту й сигнатури на кшталт `-> tuple[str, ...]:`
# (разом з усім тілом функції), `Callable[..., T]`, анотації полів і рядки з «...» в коментарях (QR-01).
[tool.coverage.run]
source = ["src/fuzzhelm"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "^\\s*\\.\\.\\.\\s*(#.*)?$",
  "^\\s*(async\\s+)?def\\s.*:\\s*\\.\\.\\.\\s*(#.*)?$",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["N818", "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003", "N802", "N803", "N806", "N815", "N816", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "S", "N"]
"scripts/**" = ["T20", "PLR"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fuzzhelm.core.*", "fuzzhelm.fuzzy.*", "fuzzhelm.risk.*"]
strict = true

