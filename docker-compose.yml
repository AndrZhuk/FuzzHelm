name: fuzzhelm
# 4 сервіси за брифінгом §9: db, api, worker, ui — усі піднімаються одним `docker compose up`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fuzzhelm
      POSTGRES_PASSWORD: fuzzhelm
      POSTGRES_DB: fuzzhelm
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzzhelm -d fuzzhelm"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    command: ["uvicorn", "fuzzhelm.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      FUZZHELM_DATABASE_URL: postgresql+asyncpg://fuzzhelm:fuzzhelm@db:5432/fuzzhelm
    ports: ["127.0.0.1:8000:8000"]   # лише localhost: API з дефолтним JWT-секретом не світимо в LAN
    # ./config — спільний з worker: PUT /risk/limits атомарно замінює config/risk_limits.yaml у цій теці,
    # а воркер після NOTIFY fuzzhelm_control перечитує той самий файл (гаряча заміна лімітів, PLAT-02).
    # ./data — ставки фандингу для POST /backtests (той самий dataset_hash, що в CLI, API-15).
    volumes:
      - ./config:/app/config
      - ./data:/app/data:ro
    depends_on: {db: {condition: service_healthy}}
  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    command: ["python", "-m", "fuzzhelm.workers.trading_worker", "--profile", "replay"]
    env_file:
      - path: .env
        required: false
    environment:
      FUZZHELM_DATABASE_URL: postgresql+asyncpg://fuzzhelm:fuzzhelm@db:5432/fuzzhelm
    # той самий ./config, що в api, лише для читання: воркер ліміти не пише, а бачить кожну заміну API
    # ./data — моделі аномалій anomaly_mlp_*.json і фандинг; у образ вони не потрапляють (.dockerignore)
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on: {db: {condition: service_healthy}}
  # Vue-панель у режимі розробки: Vite проксіює /api на сервіс api (FUZZHELM_API),
  # тож у браузері немає CORS, а адреса бекенда — одна змінна.
  ui:
    image: node:22-alpine
    working_dir: /ui
    environment:
      FUZZHELM_API: http://api:8000
    volumes:
      - ./ui:/ui
      # node_modules — іменований том: у контейнері Linux-збірки, на хості лишаються свої
      - ui_node_modules:/ui/node_modules
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
  ui_node_modules:
